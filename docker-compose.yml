# Deux services :
#   - `web`  (par défaut) : dev avec HMR, source montée en volume
#   - `prod` (profil prod) : image standalone pour valider le build de prod en local
#
# Utilisation :
#   docker compose up                 # dev → http://localhost:3000
#   docker compose --profile prod up  # prod → http://localhost:3000

services:
  web:
    build:
      context: .
      target: dev
    image: suzerain-app:dev
    container_name: suzerain-dev
    env_file:
      - path: .env.local
        required: false
    ports:
      - "3000:3000"
    volumes:
      # Source montée pour le HMR…
      - .:/app
      # …mais on masque node_modules et .next avec des volumes nommés pour ne pas
      # mélanger les binaires natifs de l'hôte (macOS) avec ceux d'alpine.
      - suzerain_node_modules:/app/node_modules
      - suzerain_next_cache:/app/.next
    restart: unless-stopped

  prod:
    profiles: ["prod"]
    build:
      context: .
      target: runner
    image: suzerain-app:prod
    container_name: suzerain-prod
    env_file:
      - path: .env.local
        required: false
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  suzerain_node_modules:
  suzerain_next_cache:
